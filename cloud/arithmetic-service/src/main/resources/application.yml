spring:
  application:
    name: arithmetic-service      # the name it is registered under in Eureka; the gateway routes to lb://arithmetic-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER:http://localhost:9000}   # cloud/auth-server: tokens must come from there
  mvc:
    problemdetails:
      enabled: true               # missing/invalid parameters -> RFC 9457 JSON errors

server:
  # Start more instances on other ports to see load balancing, e.g.  PORT=8083
  port: ${PORT:8081}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}   # unique per instance, shown in the Eureka dashboard
    lease-renewal-interval-in-seconds: 5                      # dev settings: heartbeat often,
    lease-expiration-duration-in-seconds: 15                  # and get dropped soon after stopping

management:
  endpoints:
    web:
      exposure:
        include: health,info
