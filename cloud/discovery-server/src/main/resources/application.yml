spring:
  application:
    name: discovery-server

server:
  port: ${PORT:8761}

eureka:
  client:
    # This IS the registry: don't register with, or fetch from, another Eureka.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Development settings: drop stopped instances quickly instead of protecting them
    # (self-preservation exists for network partitions in production).
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
